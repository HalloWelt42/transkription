# Ausrollen auf den Pi mit tools/ausrollen.sh (Ablauf und Prüfungen im Appkern: appkern.werkzeuge.ausrollen).
# Rechner, Ordner, Adresse, Namen im Zertifikat und Leitstelle gehören dem Haus und stehen nicht im Repo:
# tools/ausrollen.sh holt sie aus der privaten Wahrheit (handbuch ziel transkription --toml) als Ergänzung.
kennung = "transkription"
repo = "https://github.com/HalloWelt42/transkription.git"
# ton: die App nutzt den Tondienst (Tonarbeit auf dem Mac über die Leitstelle); geprüft wird, ob die Leitstelle ihn meldet
ton = true
# Zugänge besorgt das Ausrollen (HELF-77, Appkern docs/ZUGAENGE.md): der Zugang zur Leitstelle mit genau diesen
# Fähigkeiten; der Schlüssel geht als feste Einstellung in die .env auf dem Pi, niemand trägt ihn mehr ein
[zugaenge]
name = "Transkription"
leitstelle = ["text", "hoeren", "sprecher_erkennen", "sprecher_trennen", "ton"]
