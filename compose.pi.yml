# Transkription auf dem Pi, Port 8631. Vorne Caddy mit dem Zertifikat der Hausstelle (wie Kiste und
# Kellerwolke; tools/ausrollen.sh stellt es aus), dahinter die App ohne TLS, nur im eigenen Netz erreichbar.
# Daten in ./daten (SQLite, Zwischendateien). Kein ffmpeg: Ton rechnet der Tondienst auf dem Mac.
services:
  transkription:
    build: .
    image: transkription:aktuell
    container_name: transkription
    restart: unless-stopped
    user: "1000:1000"
    expose:
      - "8630"
    environment:
      TRANSKRIPTION_DATEN: /app/daten
      TRANSKRIPTION_CA_DATEI: /zertifikate/rootCA.pem
    volumes:
      - ./daten:/app/daten
      - ./zertifikate:/zertifikate:ro
      # Ortszeit des Pi (sonst UTC): Zeiten ohne Zone, etwa aus dem Altbestand, gelten als Ortszeit
      - /etc/localtime:/etc/localtime:ro

  vorne:
    image: caddy:2.11.6-alpine
    container_name: transkription-vorne
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [transkription]
    ports:
      - "8631:8631"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./zertifikate:/zertifikate:ro
